<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>🎮 Minecraft 正版账号领取</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            background:#171717;
            color:#fff;
            font-family:Arial,sans-serif;
            text-align:center;
            padding-top:120px;
        }
        .box{
            max-width:420px;
            margin:0 auto;
            background:#252525;
            padding:35px 25px;
            border-radius:12px;
            border:2px solid #48c774;
        }
        h1{color:#48c774;margin-bottom:12px;font-size:24px}
        .tip{color:#aaa;margin-bottom:30px;font-size:14px}
        #getBtn{
            border:none;
            background:#48c774;
            color:#000;
            font-size:18px;
            font-weight:bold;
            padding:14px 32px;
            border-radius:8px;
            cursor:pointer;
        }
        #getBtn:hover{
            background:#39a860;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>🎮 Minecraft 正版账号免费领取</h1>
        <p class="tip">点击下方按钮立即获取账号</p>
        <button id="getBtn">获取账号</button>
    </div>
    <script>
        const btn = document.getElementById('getBtn');
        btn.onclick = function(){
            // 标准永久BV链接
            window.location.href = "https://www.bilibili.com/video/BV1GJ411x7h7/";
        }
    </script>
</body>
</html>
